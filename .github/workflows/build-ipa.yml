name: Build unsigned IPA

# Manual-only: builds vreader as an UNSIGNED .ipa so it can be signed later with
# Sideloadly / AltStore / a personal Apple ID. No certificates or provisioning
# profiles are needed because code signing is explicitly disabled.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        type: choice
        options:
          - Release
          - Debug
        default: Release
      xcode:
        description: "Xcode version to use (e.g. 16.0, 16.4, 26.1); empty = runner default"
        type: string
        default: "16.4"
      swift_version:
        description: "SWIFT_VERSION override. 5.0 downgrades Swift 6 language-mode concurrency errors to warnings; leave empty to use the project setting"
        type: string
        default: "5.0"
      strict_concurrency:
        description: "SWIFT_STRICT_CONCURRENCY override (minimal / targeted / complete); empty = project setting"
        type: string
        default: "minimal"
      other_swift_flags:
        description: "Extra OTHER_SWIFT_FLAGS appended after $(inherited); empty = project setting"
        type: string
        default: "-enable-upcoming-feature IsolatedDefaultValues"

permissions:
  contents: read

jobs:
  build-ipa:
    name: Archive + package IPA
    runs-on: macos-15
    timeout-minutes: 120

    env:
      SCHEME: vreader
      PROJECT: vreader.xcodeproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode and report toolchain
        run: |
          set -euo pipefail
          echo "== installed Xcodes =="
          ls -1 /Applications | grep -i '^Xcode' || true

          WANT="${{ inputs.xcode }}"
          if [ -n "${WANT}" ]; then
            XC="/Applications/Xcode_${WANT}.app"
            if [ ! -d "${XC}" ]; then
              # tolerate "16.0" matching "16.0.0", and so on
              XC="$(ls -d /Applications/Xcode_${WANT}*.app 2>/dev/null | sort -V | head -1 || true)"
            fi
            if [ -z "${XC}" ] || [ ! -d "${XC}" ]; then
              echo "::error::requested Xcode ${WANT} is not installed on this runner"
              exit 1
            fi
            echo "Selecting ${XC}"
            sudo xcode-select -s "${XC}"
          else
            echo "Keeping the runner default Xcode"
          fi

          echo "== active toolchain =="
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Resolve Swift package dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "${PROJECT}" \
            -scheme "${SCHEME}"

      - name: Archive (code signing disabled)
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/out"
          mkdir -p "${OUT}"

          # Optional overrides. The repo pins SWIFT_VERSION=6.0 with
          # SWIFT_STRICT_CONCURRENCY=complete, and its sources contain
          # Swift-6-language-mode isolation errors that only become warnings
          # in Swift 5 mode (Readium 3.9 returns non-Sendable types, UIKit
          # main-actor properties are touched from nonisolated helpers).
          # These overrides change compile-time diagnostics only.
          EXTRA=()
          if [ -n "${{ inputs.swift_version }}" ]; then
            EXTRA+=("SWIFT_VERSION=${{ inputs.swift_version }}")
          fi
          if [ -n "${{ inputs.strict_concurrency }}" ]; then
            EXTRA+=("SWIFT_STRICT_CONCURRENCY=${{ inputs.strict_concurrency }}")
          fi
          # Swift 5 mode does not enable SE-0411 (isolated default value
          # expressions) by default, but this project relies on it: several
          # inits default a parameter to a @MainActor type. Enabling the
          # upcoming feature keeps those sites compiling.
          if [ -n "${{ inputs.other_swift_flags }}" ]; then
            EXTRA+=("OTHER_SWIFT_FLAGS=\$(inherited) ${{ inputs.other_swift_flags }}")
          fi
          echo "extra settings: ${EXTRA[*]:-<none>}"

          xcodebuild archive \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration "${{ inputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -archivePath "${OUT}/vreader.xcarchive" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            "${EXTRA[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            2>&1 | tee "${OUT}/xcodebuild-archive.log"

      - name: Package Payload into .ipa
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/out"
          APP="${OUT}/vreader.xcarchive/Products/Applications/vreader.app"
          if [ ! -d "${APP}" ]; then
            echo "::error::built app not found at ${APP}"
            ls -R "${OUT}/vreader.xcarchive/Products" || true
            exit 1
          fi

          cd "${OUT}"
          rm -rf Payload
          mkdir -p Payload
          cp -R "${APP}" Payload/

          # Simplified Chinese localization, applied as a bundle overlay so the
          # Xcode target stays identical to upstream. iOS resolves
          # Payload/vreader.app/zh-Hans.lproj like any Xcode-written localization.
          LOC_SRC="${GITHUB_WORKSPACE}/Localization/zh-Hans.lproj"
          if [ -d "${LOC_SRC}" ]; then
            plutil -lint "${LOC_SRC}/Localizable.strings"
            cp -R "${LOC_SRC}" Payload/vreader.app/
            python3 -c 'import plistlib; p="Payload/vreader.app/Info.plist"; d=plistlib.load(open(p,"rb")); d["CFBundleLocalizations"]=["en","zh-Hans"]; plistlib.dump(d,open(p,"wb"))'
            echo "injected: $(ls Payload/vreader.app/zh-Hans.lproj)"
            python3 -c 'p="Payload/vreader.app/zh-Hans.lproj/Localizable.strings"; n=open(p,encoding="utf-8").read().count(" = "); print("zh-Hans keys:", n)'
          else
            echo "::warning::Localization/zh-Hans.lproj is missing from the repo; shipping English only"
          fi

          IPA="vreader-${{ inputs.configuration }}-unsigned.ipa"
          zip -qry "${IPA}" Payload

          echo "== ipa =="
          ls -lh "${IPA}"
          echo "sha256=$(sha256sum "${IPA}" | cut -d' ' -f1)" | tee ipa-sha256.txt

          echo "== bundle identity =="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/vreader.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/vreader.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Payload/vreader.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" Payload/vreader.app/Info.plist

          echo "== signature state (expected: not signed) =="
          codesign -dv Payload/vreader.app 2>&1 || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vreader-ipa
          path: |
            ${{ runner.temp }}/out/*.ipa
            ${{ runner.temp }}/out/ipa-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/out/xcodebuild-archive.log
          if-no-files-found: ignore
          retention-days: 7
